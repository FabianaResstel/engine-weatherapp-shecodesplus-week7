<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <h1>Lisbon</h1>
        <h2>Tuesday , May 5. 2026 | 02:07 PM</h2>



    </header>
    <main>
        <div class="container">
            <div class="weather-icon">🌧️</div>
            <span class="weather-temperature">24</span>
            <span class="weather-unit">°C</span>
            <div class="weather-forecast">Moderate Rain</div>
            <div class="weather-humidity">
                <div class="weather-humidity-icon">💧</div>
                <div class="weather-humidity-data">82%</div>
                <div class="weather-wind-icon">🍃</div>
                <div class="weather-wind-data">15 km/h</div>
            </div>
        </div>
    </main>
    <footer>
        <div class="footer">
            Coded by <a href="#">Fabiana Resstel</a> | <a href="#">GitHub</a> | <a href="#">Netlify</a>
        </div>
    </footer>
    <script src="script.js"></script>
</body>

</html>

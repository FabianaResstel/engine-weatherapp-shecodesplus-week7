<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Roboto+Slab:wght@100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=air" />
    <script src="https://unpkg.com/axios@1.1.2/dist/axios.min.js"></script>
</head>

<body>
    <div class="container">
        <img src="images/logo1.jpg" alt="branch" width="100px" class="picture">
        <h1></h1>
        <h2 id="time"></h2>

        <div class="weather-icon"> <img src="images/rainy.png" alt="rainy" width="100px"> </div>
        <span class="weather-temperature" id="weather-temperature-response"></span>
        <span class="weather-unit">°C</span>
        <div class="weather-forecast" id="weather-forecast-response"></div>
        <div class="weather-humidity">
            <span class="weather-humidity-icon">💧
            </span>
            <span class="weather-humidity-data" id="weather-humidity-response"></span>

        </div>
        <div class="weather-wind">
            <span class="material-symbols-outlined">
                air
            </span>
            <span class="weather-wind-data" id="weather-wind-response"></span>
        </div>

        <form class="search" id="search-form">
            <input type="search" placeholder="Enter a city" required class="search-input" id="search-form-input">
            <input type="submit" value="🔍" class="search-button" id="search-form-button">
        </form>
    </div>

</body>
<footer>

    Coded by <a href="https://github.com/FabianaResstel" target="_blank">Fabiana Resstel</a> | <a
        href="https://github.com/FabianaResstel/engine-weatherapp-shecodesplus-week7" target="_blank">GitHub</a> |
    <a href="#">Netlify</a>

</footer>
<script src="script.js"></script>
</body>

</html>
